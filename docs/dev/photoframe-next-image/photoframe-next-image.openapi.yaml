openapi: 3.1.0
info:
  title: Photoframe Next Image HTTP Binding
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description: >-
    This document describes the HTTP binding of the photoframe next-image
    contract. The normative contract, including all behavioral requirements and
    the G16P/G16Z byte formats, is
    docs/dev/photoframe-next-image/contract.md, which is authoritative wherever
    this document is silent or ambiguous.
servers:
  - url: "{scheme}://{host}/api/v1"
    description: Photoframe next-image service
    variables:
      scheme:
        default: https
        enum:
          - http
          - https
      host:
        default: photoframe.local
paths:
  /next:
    get:
      operationId: getNextImage
      summary: Get the desired display state
      description: >-
        Returns exact transport bytes inline, redirects to exact transport
        bytes, or tells the frame to keep its current display. Request handling,
        selection, redirects, validation, caching, and retry behavior are
        normative only in contract.md.
      parameters:
        - $ref: "#/components/parameters/CurrentImageKey"
        - $ref: "#/components/parameters/CurrentContentCrc32"
      responses:
        "200":
          $ref: "#/components/responses/InlineImage"
        "204":
          $ref: "#/components/responses/KeepDisplay"
        "302":
          $ref: "#/components/responses/RedirectImage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UnsupportedMajor"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        5XX:
          $ref: "#/components/responses/TemporaryFailure"
      security:
        - frameToken: []
  /next-batch:
    get:
      operationId: getNextImageBatch
      summary: Select an ordered batch of exact image references
      description: >-
        Returns up to count distinct valid selections in order. The reported
        current fingerprint and earlier entries in the same batch are excluded.
        Included entries are committed as selected, not displayed.
      parameters:
        - $ref: "#/components/parameters/BatchCount"
        - $ref: "#/components/parameters/CurrentImageKey"
        - $ref: "#/components/parameters/CurrentContentCrc32"
      responses:
        "200":
          $ref: "#/components/responses/BatchManifest"
        "204":
          $ref: "#/components/responses/KeepDisplay"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        5XX:
          $ref: "#/components/responses/TemporaryFailure"
      security:
        - frameToken: []
  /content/{image_key}/{format_code}/{content_length}/{content_crc32}:
    get:
      operationId: getSelectedImageContent
      summary: Fetch one batch-selected exact transport
      description: >-
        Resolves only the immutable descriptor identified by the path for the
        authenticated frame. Length and CRC32 are rechecked before delivery;
        another image or variant is never substituted.
      parameters:
        - $ref: "#/components/parameters/ReferencedImageKey"
        - $ref: "#/components/parameters/ReferencedFormatCode"
        - $ref: "#/components/parameters/ReferencedContentLength"
        - $ref: "#/components/parameters/ReferencedContentCrc32"
      responses:
        "200":
          $ref: "#/components/responses/InlineImage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ReferenceNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        5XX:
          $ref: "#/components/responses/TemporaryFailure"
      security:
        - frameToken: []
components:
  securitySchemes:
    frameToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >-
        Opaque frame credential. The token identifies one frame and binds its
        supported formats and exact panel geometry.
  schemas:
    ImageKey:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[A-Za-z0-9_-]+$"
      description: Stable opaque logical-image identifier.
    ContentCrc32:
      type: string
      pattern: "^[0-9a-f]{8}$"
      description: >-
        CRC-32 of the exact transport bytes, encoded as eight lowercase
        hexadecimal digits. The value 00000000 is valid.
    BinaryImage:
      type: string
      format: binary
      description: >-
        Exact transport bytes. Binary layouts and validation requirements are
        defined only in contract.md.
    FormatCode:
      type: integer
      enum: [1, 2, 3]
      description: Registered exact-byte transport format.
    BatchEntry:
      type: object
      additionalProperties: false
      required:
        - image_key
        - content_crc32
        - media_type
        - content_length
        - content_url
      properties:
        image_key:
          $ref: "#/components/schemas/ImageKey"
        content_crc32:
          $ref: "#/components/schemas/ContentCrc32"
        media_type:
          type: string
          enum:
            - image/jpeg
            - application/vnd.photoframe.g16p
            - application/vnd.photoframe.g16z
        content_length:
          type: integer
          minimum: 1
        content_url:
          type: string
          format: uri-reference
          description: >-
            Bearer-authenticated immutable reference for this selected
            descriptor and expected fingerprint.
    BatchManifest:
      type: object
      additionalProperties: false
      required:
        - images
      properties:
        images:
          type: array
          minItems: 1
          maxItems: 17
          items:
            $ref: "#/components/schemas/BatchEntry"
  parameters:
    BatchCount:
      name: count
      in: query
      required: true
      description: Total number of ordered image entries requested.
      schema:
        type: integer
        minimum: 1
        maximum: 17
    CurrentImageKey:
      name: Photoframe-Current-Image-Key
      in: header
      required: false
      description: >-
        Advisory key of the last image successfully displayed. The key and CRC
        headers form one optional pair; contract.md defines malformed and partial
        pair handling.
      schema:
        $ref: "#/components/schemas/ImageKey"
    CurrentContentCrc32:
      name: Photoframe-Current-Content-CRC32
      in: header
      required: false
      description: >-
        Advisory transport CRC of the last image successfully displayed. The key
        and CRC headers form one optional pair.
      schema:
        $ref: "#/components/schemas/ContentCrc32"
    ReferencedImageKey:
      name: image_key
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ImageKey"
    ReferencedFormatCode:
      name: format_code
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/FormatCode"
    ReferencedContentLength:
      name: content_length
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ReferencedContentCrc32:
      name: content_crc32
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ContentCrc32"
  headers:
    ImageKey:
      required: true
      description: Stable opaque logical-image identifier.
      schema:
        $ref: "#/components/schemas/ImageKey"
    ContentCrc32:
      required: true
      description: CRC-32 of the exact transport bytes.
      schema:
        $ref: "#/components/schemas/ContentCrc32"
    CacheControl:
      required: true
      description: Prevents shared-cache reuse and requires revalidation.
      schema:
        type: string
        const: private, no-cache
    VaryAuthorization:
      required: true
      description: Separates cached responses by Authorization.
      schema:
        type: string
        const: Authorization
    IdentityContentEncoding:
      required: false
      description: If present, the only permitted HTTP content coding is identity.
      schema:
        type: string
        const: identity
    Location:
      required: true
      description: Delivery reference for the exact transport content.
      schema:
        type: string
        format: uri-reference
    WwwAuthenticate:
      required: true
      description: Bearer authentication challenge.
      schema:
        type: string
        const: Bearer
    AllowGet:
      required: true
      description: The only method supported by this operation.
      schema:
        type: string
        const: GET
  responses:
    BatchManifest:
      description: Ordered, distinct, validated exact-content references.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        Vary:
          $ref: "#/components/headers/VaryAuthorization"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BatchManifest"
    InlineImage:
      description: Exact desired image transport bytes.
      headers:
        Photoframe-Image-Key:
          $ref: "#/components/headers/ImageKey"
        Photoframe-Content-CRC32:
          $ref: "#/components/headers/ContentCrc32"
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        Vary:
          $ref: "#/components/headers/VaryAuthorization"
        Content-Encoding:
          $ref: "#/components/headers/IdentityContentEncoding"
      content:
        image/jpeg:
          schema:
            $ref: "#/components/schemas/BinaryImage"
        application/vnd.photoframe.g16p:
          schema:
            $ref: "#/components/schemas/BinaryImage"
        application/vnd.photoframe.g16z:
          schema:
            $ref: "#/components/schemas/BinaryImage"
    RedirectImage:
      description: >-
        Manual redirect to exact transport content. The frame captures image
        metadata from this response and fetches Location without its bearer
        token. Automatic redirect following is non-conforming.
      headers:
        Location:
          $ref: "#/components/headers/Location"
        Photoframe-Image-Key:
          $ref: "#/components/headers/ImageKey"
        Photoframe-Content-CRC32:
          $ref: "#/components/headers/ContentCrc32"
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        Vary:
          $ref: "#/components/headers/VaryAuthorization"
    KeepDisplay:
      description: >-
        Keep the current display exactly as it is. This response has no body,
        image metadata, or retry hint.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        Vary:
          $ref: "#/components/headers/VaryAuthorization"
    Unauthorized:
      description: >-
        Bearer token is missing or invalid. Missing, unknown, and revoked tokens
        produce identical responses and do not contain image metadata.
      headers:
        WWW-Authenticate:
          $ref: "#/components/headers/WwwAuthenticate"
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        Vary:
          $ref: "#/components/headers/VaryAuthorization"
    BadRequest:
      description: A required request value is missing, malformed, or outside its bounds.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        Vary:
          $ref: "#/components/headers/VaryAuthorization"
    ReferenceNotFound:
      description: The immutable content reference does not exist for this frame.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        Vary:
          $ref: "#/components/headers/VaryAuthorization"
    UnsupportedMajor:
      description: The requested endpoint major is unsupported.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        Vary:
          $ref: "#/components/headers/VaryAuthorization"
    MethodNotAllowed:
      description: The request method is not GET.
      headers:
        Allow:
          $ref: "#/components/headers/AllowGet"
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        Vary:
          $ref: "#/components/headers/VaryAuthorization"
    TemporaryFailure:
      description: Temporary service failure. The response has no image metadata.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        Vary:
          $ref: "#/components/headers/VaryAuthorization"
