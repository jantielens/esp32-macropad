<div class="section-header">
  <h2>📶 WiFi Settings</h2>
  <p>Configure wireless network connection.</p>
</div>
    <div class="d-flex align-items-center mb-3">
      <span class="status-dot connected"></span>
      <strong>Connected</strong>
      <span class="text-muted ms-2">— MyHomeNetwork (-42 dBm)</span>
    </div>
    <div class="mb-3">
      <label class="form-label" for="wifi-ssid">SSID</label>
      <input type="text" class="form-control" id="wifi-ssid" value="MyHomeNetwork">
    </div>
    <div class="mb-3">
      <label class="form-label" for="wifi-pass">Password</label>
      <input type="password" class="form-control" id="wifi-pass" placeholder="Enter WiFi password">
      <div class="form-text">Leave empty to keep current password.</div>
    </div>
    <div class="save-bar">
      <button class="btn btn-primary btn-sm">Save &amp; Reconnect</button>
    </div>
