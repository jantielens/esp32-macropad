<div class="section-header">
  <h2>📡 MQTT</h2>
  <p>Configure the MQTT broker for Home Assistant integration and remote control.</p>
</div>
    <div class="d-flex align-items-center mb-3">
      <span class="status-dot connected"></span>
      <strong class="small">Connected to broker</strong>
    </div>
    <div class="row g-3 mb-3">
      <div class="col-md-8">
        <label class="form-label" for="mqtt-host">Broker Hostname</label>
        <input type="text" class="form-control" id="mqtt-host" value="homeassistant.local">
      </div>
      <div class="col-md-4">
        <label class="form-label" for="mqtt-port">Port</label>
        <input type="number" class="form-control" id="mqtt-port" value="1883">
      </div>
    </div>
    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <label class="form-label" for="mqtt-user">Username</label>
        <input type="text" class="form-control" id="mqtt-user" value="mqtt_user">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="mqtt-pass">Password</label>
        <input type="password" class="form-control" id="mqtt-pass" placeholder="••••••••">
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="mqtt-topic">Base Topic</label>
      <input type="text" class="form-control" id="mqtt-topic" value="macropad/esp32-macropad">
      <div class="form-text">State publishes to <code>{base}/state</code>, commands on <code>{base}/command</code>.</div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="mqtt-scope">Payload Scope</label>
      <select class="form-select" id="mqtt-scope">
        <option selected>Full</option>
        <option>Minimal</option>
      </select>
      <div class="form-text">Controls which fields are included in the MQTT state payload.</div>
    </div>
    <div class="save-bar">
      <button class="btn btn-primary btn-sm">Save &amp; Reboot</button>
    </div>
