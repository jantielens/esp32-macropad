<div class="section-header">
  <h2>🎨 Button Defaults</h2>
  <p>Device-wide default appearance for all buttons.</p>
</div>
    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <label class="form-label" for="bd-bg-color">Background Color</label>
        <div class="input-group input-group-sm">
          <input type="color" class="form-control form-control-color" id="bd-bg-color" value="#333333">
          <input type="text" class="form-control" value="#333333">
        </div>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="bd-text-color">Text Color</label>
        <div class="input-group input-group-sm">
          <input type="color" class="form-control form-control-color" id="bd-text-color" value="#ffffff">
          <input type="text" class="form-control" value="#ffffff">
        </div>
      </div>
    </div>
    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <label class="form-label" for="bd-border-color">Border Color</label>
        <div class="input-group input-group-sm">
          <input type="color" class="form-control form-control-color" id="bd-border-color" value="#555555">
          <input type="text" class="form-control" value="#555555">
        </div>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="bd-border-radius">Border Radius</label>
        <input type="number" class="form-control form-control-sm" id="bd-border-radius" value="8" min="0" max="50">
      </div>
    </div>
    <div class="save-bar">
      <button class="btn btn-primary btn-sm">Save Button Defaults</button>
    </div>
