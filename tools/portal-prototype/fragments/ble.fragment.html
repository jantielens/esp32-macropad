<div class="section-header">
  <h2>⌨️ BLE Keyboard</h2>
  <p>Bluetooth LE keyboard for sending key sequences to paired devices.</p>
</div>
    <div class="form-check form-switch mb-3">
      <input class="form-check-input" type="checkbox" id="ble-enable" checked>
      <label class="form-check-label" for="ble-enable">Enable BLE Keyboard</label>
      <div class="form-text">Uses ~70 KB RAM when enabled. Requires reboot.</div>
    </div>
    <div class="d-flex align-items-center gap-2 mb-3 p-2 rounded" style="background: rgba(255,255,255,0.03);">
      <span class="status-dot connected"></span>
      <div>
        <strong class="small">Paired</strong>
        <span class="text-muted small ms-1">— MacBook Pro (Jan)</span>
      </div>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-outline-danger btn-sm">Forget Device</button>
      <button class="btn btn-outline-secondary btn-sm">Re-pair</button>
    </div>
    <div class="save-bar">
      <button class="btn btn-primary btn-sm">Save &amp; Reboot</button>
    </div>
