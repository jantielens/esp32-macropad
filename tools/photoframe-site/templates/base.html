<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Photoframe{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    /* Shared design system: a single bold, simple visual language for every page,
       distilled from the upload flow (purple->pink accent, rounded cards, gradient
       buttons, ghost links). Component classes here so individual templates stay
       lean and consistent. */
    :root {
      --accent: #6d28d9;
      --accent-2: #db2777;
      --accent-soft: rgba(109, 40, 217, .10);
    }
    body { background: var(--bs-body-bg); }

    .navbar-brand { font-weight: 800; letter-spacing: .01em; }

    /* Page headings: bold and a touch tighter. */
    .page-title { font-weight: 800; letter-spacing: .01em; }
    .eyebrow {
      text-transform: uppercase; letter-spacing: .04em;
      font-weight: 700; font-size: .72rem;
    }

    /* Circular numbered/icon chip with the accent gradient. */
    .num-chip {
      flex: 0 0 auto; width: 2rem; height: 2rem; border-radius: 50%;
      display: grid; place-items: center; font-weight: 800; color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 2px 6px rgba(109, 40, 217, .35);
    }

    /* Rounded panel for forms/sections (mirrors the upload .step). */
    .section-card {
      border: 1px solid var(--bs-border-color);
      border-radius: 1rem;
      background: var(--bs-body-bg);
      box-shadow: 0 1px 2px rgba(0, 0, 0, .04);
      transition: box-shadow .15s ease, border-color .15s ease;
    }
    .section-card:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 .2rem rgba(109, 40, 217, .15);
    }

    /* Grid card (devices, gallery). Use with .card. */
    .app-card {
      border: 1px solid var(--bs-border-color);
      border-radius: 1rem;
      overflow: hidden;
      background: var(--bs-body-bg);
      box-shadow: 0 1px 3px rgba(17, 12, 34, .06);
      transition: box-shadow .15s ease;
    }
    .app-card:hover {
      box-shadow: 0 10px 26px rgba(17, 12, 34, .12);
    }

    /* Bold gradient primary button. Use with Bootstrap's .btn for sizing. */
    .btn-accent {
      border: 0; font-weight: 800; letter-spacing: .01em; color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 6px 18px rgba(109, 40, 217, .30);
      transition: transform .08s ease, box-shadow .15s ease, color .15s ease;
    }
    .btn-accent:hover {
      transform: translateY(-1px); color: #fff;
      box-shadow: 0 10px 24px rgba(109, 40, 217, .42);
    }
    .btn-accent:active { transform: translateY(0); }

    /* Soft accent button for secondary actions. */
    .btn-accent-soft {
      border: 1px solid var(--accent); font-weight: 700;
      color: var(--accent); background: var(--accent-soft);
    }
    .btn-accent-soft:hover { color: var(--accent); background: rgba(109, 40, 217, .18); }

    /* Accent text link without underline. */
    .ghost-link { color: var(--accent); font-weight: 700; text-decoration: none; }
    .ghost-link:hover { color: var(--accent-2); }

    /* Softer, pill-shaped badges site-wide. */
    .badge { border-radius: 999px; }
  </style>
</head>
<body class="bg-body-tertiary">
  <nav class="navbar navbar-expand-lg bg-dark border-bottom border-3 border-primary-subtle"
       data-bs-theme="dark" style="border-bottom-color: var(--accent) !important;">
    <div class="container">
      <a class="navbar-brand" href="/">📷 Photoframe</a>
      {% if user %}
      <div class="d-flex align-items-center gap-3">
        {% if request.app.state.config.users|length == 1 %}
        <a class="navbar-text small text-decoration-none" href="/site-admin">Site export &amp; import</a>
        {% endif %}
        <span class="navbar-text small">{{ user.email }}</span>
        <form method="post" action="/logout" class="m-0">
          <button class="btn btn-sm btn-outline-light" type="submit">Log out</button>
        </form>
      </div>
      {% endif %}
    </div>
  </nav>

  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
