<div class="section-header">
  <h2>📦 Manual Upload</h2>
  <p>Upload a firmware .bin file directly to the device.</p>
</div>
<div class="card mb-3">
  <div class="card-body">
    <div class="mb-3">
      <label class="form-label" for="firmware-file">Firmware File (.bin)</label>
      <input type="file" class="form-control" id="firmware-file" accept=".bin">
    </div>
    <button type="button" class="btn btn-primary btn-sm" id="upload-btn" disabled>Upload Firmware</button>
  </div>
</div>
{{REBOOT_OVERLAY}}
