<div class="section-header">
  <h2>🔘 Hardware Buttons</h2>
  <p>Configure tap and hold actions for the physical buttons on this device.</p>
</div>
<div class="card mb-3">
  <div class="card-body">
    <p id="hw-button-headless-note" class="text-muted" style="display:none; font-size:13px;">
      Note: this device has no display. Screen, back, brightness, notification, timer, and screensaver actions will have no effect.
    </p>
    <div id="hw-button-editors"></div>
    <div class="save-bar">
      <button type="button" class="btn btn-primary btn-sm" onclick="saveHwButtons()">Save Hardware Buttons</button>
    </div>
  </div>
</div>
