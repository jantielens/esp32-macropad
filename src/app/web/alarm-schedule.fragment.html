<div class="section-header"><h2>Alarm schedule</h2></div>
<div id="alarm-readiness" role="status"></div>
<div id="alarm-warning" role="status" class="text-danger" hidden></div>
<form id="alarm-config-form" data-section="schedule">
  <div class="form-group"><label><input type="checkbox" id="alarm-enabled"> Enabled</label></div>
  <div class="form-group"><label class="form-label" for="alarm-time">Time</label><input type="time" class="form-control" id="alarm-time" value="07:00" style="max-width:320px" required></div>
  <fieldset class="form-group" style="border:0;padding:0"><legend class="form-label">Repeat days</legend>
    <div style="display:flex;flex-wrap:wrap;gap:16px">
      <label><input type="checkbox" id="alarm-day-1"> Mon</label>
      <label><input type="checkbox" id="alarm-day-2"> Tue</label>
      <label><input type="checkbox" id="alarm-day-3"> Wed</label>
      <label><input type="checkbox" id="alarm-day-4"> Thu</label>
      <label><input type="checkbox" id="alarm-day-5"> Fri</label>
      <label><input type="checkbox" id="alarm-day-6"> Sat</label>
      <label><input type="checkbox" id="alarm-day-0"> Sun</label>
    </div>
  </fieldset>
  <div class="form-group">
    <div id="alarm-repeat-summary" role="status" aria-live="polite"></div>
    <div id="alarm-once-target" class="form-text" hidden></div>
    <div class="form-text">Select days to repeat weekly, or leave all days unchecked for a one-time alarm. Times use the device timezone.</div>
    <div id="alarm-once-note" class="form-text" hidden>After ringing, the alarm turns itself off. Snooze still works.</div>
  </div>
  <div class="save-bar"><button type="submit" class="btn btn-primary btn-sm" id="alarm-save" disabled>Save schedule</button></div>
</form>
