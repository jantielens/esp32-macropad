<div class="section-header">
  <h2>⏱️ Timers</h2>
  <p>Configure per-slot actions that run when a countdown expires. Mode and duration are set by each Timer action. Changes apply when the next countdown starts; stop and start a running timer to use its updated actions.</p>
</div>
<div class="card mb-3">
  <div class="card-body">
    <div id="timer-config-editors"></div>
    <div class="save-bar">
      <button type="button" class="btn btn-primary btn-sm" onclick="saveTimerConfig()">Save Timer Config</button>
    </div>
  </div>
</div>
