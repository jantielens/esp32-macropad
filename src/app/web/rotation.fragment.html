<div class="section-header">
  <h2>Screen Rotation</h2>
</div>
<div class="card mb-3">
  <div class="card-body">
    <div class="mb-3">
      <label class="form-label" for="display_rotation">Rotation</label>
      <select class="form-select" id="display_rotation" name="display_rotation">
        <option value="0">0° (board default)</option>
        <option value="1">90° clockwise</option>
        <option value="2">180°</option>
        <option value="3">270° clockwise</option>
      </select>
      <div class="form-text">Relative to the board's built-in orientation. Takes effect after reboot.</div>
    </div>
    <div class="save-bar">
      <button type="button" class="btn btn-primary btn-sm" id="rotation-save-btn">Save</button>
    </div>
  </div>
</div>
