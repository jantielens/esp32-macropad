<div class="section-header">
  <h2>🔆 Brightness</h2>
  <p>Adjust the display backlight brightness.</p>
</div>
<div class="card mb-3" id="brightness-section">
  <div class="card-body">
    <div class="mb-3">
      <label class="form-label" for="backlight_brightness">Backlight Brightness: <strong id="brightness-value">100</strong>%</label>
      <input type="range" class="form-range" id="backlight_brightness" name="backlight_brightness" min="5" max="100" value="100">
      <div class="form-text">Brightness adjusts immediately. Click Save to persist across reboots.</div>
    </div>
    <div class="mb-3" id="screen-selection-group" style="display:none;">
      <label class="form-label" for="screen_selection">Current Screen</label>
      <select class="form-select" id="screen_selection" name="screen_selection"></select>
      <div class="form-text">Switch between screens instantly. Selection is not saved (resets on reboot).</div>
    </div>
    <div class="save-bar">
      <button type="button" class="btn btn-primary btn-sm" id="brightness-save-btn">Save</button>
    </div>
  </div>
</div>
