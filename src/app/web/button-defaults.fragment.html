<div class="section-header">
    <h2>🎨 Button Defaults</h2>
    <p>Set default appearance for all buttons on all pads. Individual buttons can override these values.</p>
</div>
    <div style="display:flex; gap:12px; margin-bottom:8px;">
        <div id="pad-def-bg-color-wrap" style="flex:1;">
            <label style="font-size:13px; font-weight:600; margin-bottom:2px; display:block;">Background <span class="fx-hint" onclick="showBindingHelp()">fx</span></label>
            <div class="bindable-color">
                <div class="bc-swatch"></div>
                <input type="text" id="pad-def-bg-color" class="bc-input" maxlength="191" spellcheck="false" placeholder="(firmware default)">
            </div>
        </div>
        <div id="pad-def-fg-color-wrap" style="flex:1;">
            <label style="font-size:13px; font-weight:600; margin-bottom:2px; display:block;">Text <span class="fx-hint" onclick="showBindingHelp()">fx</span></label>
            <div class="bindable-color">
                <div class="bc-swatch"></div>
                <input type="text" id="pad-def-fg-color" class="bc-input" maxlength="191" spellcheck="false" placeholder="(firmware default)">
            </div>
        </div>
        <div id="pad-def-border-color-wrap" style="flex:1;">
            <label style="font-size:13px; font-weight:600; margin-bottom:2px; display:block;">Border <span class="fx-hint" onclick="showBindingHelp()">fx</span></label>
            <div class="bindable-color">
                <div class="bc-swatch"></div>
                <input type="text" id="pad-def-border-color" class="bc-input" maxlength="191" spellcheck="false" placeholder="(firmware default)">
            </div>
        </div>
    </div>
    <div style="display:flex; gap:12px;">
        <div class="form-group" style="flex:1; margin-bottom:4px;">
            <label for="pad-def-border-width" style="font-size:13px;">Border Width <span class="fx-hint" onclick="showBindingHelp()">fx</span></label>
            <input type="text" id="pad-def-border-width" class="form-control form-control-sm" maxlength="63" style="width:100%;" placeholder="(firmware default)">
        </div>
        <div class="form-group" style="flex:1; margin-bottom:4px;">
            <label for="pad-def-corner-radius" style="font-size:13px;">Radius <span class="fx-hint" onclick="showBindingHelp()">fx</span></label>
            <input type="text" id="pad-def-corner-radius" class="form-control form-control-sm" maxlength="63" style="width:100%;" placeholder="(firmware default)">
        </div>
        <div class="form-group" style="flex:1; margin-bottom:4px;">
            <label for="pad-def-content-pad" style="font-size:13px;">Padding</label>
            <input type="number" id="pad-def-content-pad" class="form-control form-control-sm" min="0" max="50" style="width:100%;" placeholder="(firmware default)">
        </div>
    </div>
    <div style="display:flex; gap:12px; margin-top:4px;">
        <div class="form-group" style="flex:1; margin-bottom:4px;">
            <label for="pad-def-label-top-style" style="font-size:13px;">Top Label Style</label>
            <input type="text" id="pad-def-label-top-style" class="form-control form-control-sm label-style-input" maxlength="127" style="width:100%;" placeholder="e.g. font_size:24;align:left">
        </div>
        <div class="form-group" style="flex:1; margin-bottom:4px;">
            <label for="pad-def-label-center-style" style="font-size:13px;">Center Label Style</label>
            <input type="text" id="pad-def-label-center-style" class="form-control form-control-sm label-style-input" maxlength="127" style="width:100%;" placeholder="e.g. font_size:18;mode:dot">
        </div>
        <div class="form-group" style="flex:1; margin-bottom:4px;">
            <label for="pad-def-label-bottom-style" style="font-size:13px;">Bottom Label Style</label>
            <input type="text" id="pad-def-label-bottom-style" class="form-control form-control-sm label-style-input" maxlength="127" style="width:100%;" placeholder="e.g. font_size:14;align:right">
        </div>
    </div>

    <div class="form-group" style="margin-top:8px;">
        <label for="pad-def-icon-position" style="font-size:13px;">Default Icon Position</label>
        <select id="pad-def-icon-position" class="form-select form-select-sm" style="max-width:200px;">
            <option value="above">Above label</option>
            <option value="left">Left of label</option>
            <option value="center">Centered (icon only)</option>
        </select>
    </div>

    <div class="save-bar">
        <button type="button" id="btn-defaults-save-btn" class="btn btn-primary btn-sm">Save Button Defaults</button>
    </div>

{{BINDING_HELP}}

{{STYLE_HELP}}
