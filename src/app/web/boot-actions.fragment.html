<div class="section-header">
  <h2><span class="portal-icon" aria-hidden="true">power_settings_new</span>Boot Actions</h2>
  <p>Configure actions to run when the device boots.</p>
</div>
<div class="card mb-3">
  <div class="card-body">
    <p class="form-text">Run up to 3 actions in order each time the device boots.</p>
    <div id="boot-action-editors"></div>
    <div class="save-bar">
      <button type="button" class="btn btn-primary btn-sm" onclick="saveBootActions()">Save Boot Actions</button>
    </div>
  </div>
</div>
