<div class="section-header">
  <h2>🔊 Volume</h2>
  <p>Set the device audio output level.</p>
</div>
<div class="card mb-3" id="audio-section">
  <div class="card-body">
    <div class="mb-3">
      <label class="form-label" for="audio_volume">Volume: <strong id="audio_volume_value">50</strong>%</label>
      <input type="range" class="form-range" id="audio_volume" name="audio_volume" min="0" max="100" step="5" value="50" oninput="document.getElementById('audio_volume_value').textContent=this.value">
      <div class="form-text">Device audio volume (0–100%). Applies to alerts, Music, and button feedback.</div>
    </div>
    <div class="save-bar">
      <button type="button" class="btn btn-primary btn-sm" id="volume-save-btn">Save</button>
    </div>
  </div>
</div>
