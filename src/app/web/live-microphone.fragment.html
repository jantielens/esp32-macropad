<div class="section-header">
  <h2><span class="portal-icon" aria-hidden="true">mic</span>Live Microphone</h2>
  <p>Listen to this device's microphone in your browser.</p>
</div>
<div class="card">
  <div class="card-body">
    <p>Audio is sent unencrypted. Use only on a trusted network.</p>
    <div class="d-flex gap-2">
      <button type="button" class="btn btn-primary" id="live-microphone-start">Start listening</button>
      <button type="button" class="btn btn-outline-secondary" id="live-microphone-stop" disabled>Stop</button>
    </div>
    <div id="live-microphone-status" class="form-text mt-2" role="status">Not listening</div>
  </div>
</div>
