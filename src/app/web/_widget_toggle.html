<details class="editor-group" id="pad-edit-toggle-section" style="display:none;" open>
    <summary>Toggle switch</summary>
    <div class="editor-group-body">
        <div class="form-group">
            <label for="pad-edit-toggle-source">State source <span class="fx-hint" onclick="showBindingHelp()">fx</span></label>
            <div class="binding-input-wrap"><input type="text" class="binding-mono" id="pad-edit-toggle-source" maxlength="191" placeholder="[ha:switch.desk_lamp]"></div>
        </div>
        <div class="widget-row">
            <div class="form-group"><label for="pad-edit-toggle-on-value">On value</label><input type="text" id="pad-edit-toggle-on-value" maxlength="63" required value="on"></div>
            <div class="form-group"><label for="pad-edit-toggle-off-value">Off value</label><input type="text" id="pad-edit-toggle-off-value" maxlength="63" required value="off"></div>
        </div>
        <div class="form-group"><label><input type="checkbox" id="pad-edit-toggle-read-only"> Read-only</label></div>
        <div class="widget-row">
            <div class="form-group"><label for="pad-edit-toggle-on-color">On track</label><div class="bindable-color"><div class="bc-swatch"></div><input type="text" class="bc-input" data-allow-bindings="false" id="pad-edit-toggle-on-color" maxlength="7" value="#4CAF50"></div></div>
            <div class="form-group"><label for="pad-edit-toggle-off-color">Off track</label><div class="bindable-color"><div class="bc-swatch"></div><input type="text" class="bc-input" data-allow-bindings="false" id="pad-edit-toggle-off-color" maxlength="7" value="#1A1A1A"></div></div>
            <div class="form-group"><label for="pad-edit-toggle-knob-color">Knob</label><div class="bindable-color"><div class="bc-swatch"></div><input type="text" class="bc-input" data-allow-bindings="false" id="pad-edit-toggle-knob-color" maxlength="7" value="#FFFFFF"></div></div>
        </div>
        <div class="widget-row">
            <div class="form-group"><label for="pad-edit-toggle-width-pct">Switch size (%)</label><input type="number" id="pad-edit-toggle-width-pct" min="20" max="100" step="1" value="100"></div>
            <div class="form-group"><label for="pad-edit-toggle-icon-position">Icon Position</label><select id="pad-edit-toggle-icon-position"><option value="left">Left</option><option value="above">Above</option><option value="below">Below</option></select></div>
        </div>
    </div>
</details>
