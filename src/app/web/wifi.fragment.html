<div class="section-header">
  <h2>📶 WiFi Settings</h2>
  <p>Configure wireless network connection.</p>
</div>
<div id="setup-notice" class="alert alert-info" style="display:none;">
  <strong>First-Time Setup:</strong> Enter your WiFi credentials to connect the device to your network.
</div>
<div class="card mb-3">
  <div class="card-body">
    <div class="mb-3">
      <label class="form-label" for="wifi_ssid">WiFi SSID</label>
      <input type="text" class="form-control" id="wifi_ssid" name="wifi_ssid">
    </div>
    <div class="mb-3">
      <label class="form-label" for="wifi_password">WiFi Password</label>
      <input type="password" class="form-control" id="wifi_password" name="wifi_password" placeholder="Leave empty to keep current">
    </div>
    <div class="save-bar">
      <button type="button" class="btn btn-primary btn-sm" id="wifi-save-btn">Save &amp; Reboot</button>
    </div>
  </div>
</div>
