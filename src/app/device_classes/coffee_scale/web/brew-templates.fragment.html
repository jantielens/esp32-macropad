<div class="section-header">
    <h2><span class="portal-icon" aria-hidden="true">list_alt</span>Brew Templates</h2>
  <p>Manage brew recipes and automation templates.</p>
</div>

<!-- Template List -->
<div id="brew-tmpl-list-view" class="portal-section portal-list-section">
    <div class="brew-action-bar">
        <button type="button" class="btn btn-secondary btn-sm" id="brew-tmpl-upload-btn">Upload Template</button>
        <input type="file" accept=".json" id="brew-tmpl-upload-file" style="display:none;">
    </div>
    <div id="brew-tmpl-cards"></div>
    <div id="brew-tmpl-empty" class="brew-empty" style="display:none;">
        <p>No custom templates yet.</p>
    </div>
</div>

<!-- Template Detail View -->
<div id="brew-tmpl-detail-view" style="display:none;">
    <button type="button" class="btn btn-secondary btn-sm" id="brew-tmpl-back-btn">← Back to Templates</button>

    <div class="portal-section">
        <div class="brew-tmpl-detail-header">
            <h3 class="portal-section-title" id="brew-tmpl-detail-name">Template</h3>
            <span id="brew-tmpl-detail-badge" class="brew-tmpl-badge"></span>
        </div>
        <div class="brew-tmpl-detail-desc" id="brew-tmpl-detail-desc"></div>
        <div class="brew-tmpl-detail-meta" id="brew-tmpl-detail-meta"></div>
    </div>

    <div class="portal-section">
        <h3 class="portal-section-title">Stages</h3>
        <div class="brew-tmpl-timeline" id="brew-tmpl-stages"></div>
    </div>

    <details class="portal-section">
        <summary class="brew-tmpl-summary portal-section-title">Raw JSON</summary>
        <pre class="brew-tmpl-json" id="brew-tmpl-detail-json"></pre>
    </details>

    <div class="brew-tmpl-detail-actions" id="brew-tmpl-detail-actions"></div>
</div>
