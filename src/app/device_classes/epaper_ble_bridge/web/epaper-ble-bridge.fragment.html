<div class="section-header">
  <h2>Frame Assignments</h2>
  <p>Frames polled by this bridge and advertised over BLE.</p>
</div>

<div class="card mb-3">
  <div class="card-header"><strong>Frame 1</strong></div>
  <div class="card-body" data-bridge-frame="0">
    <div class="mb-3 form-check">
      <input type="checkbox" class="form-check-input bridge-frame-enabled" id="bridge_frame_0_enabled">
      <label class="form-check-label" for="bridge_frame_0_enabled">Configure this frame</label>
    </div>
    <div class="bridge-frame-fields">
      <div class="mb-3">
        <label class="form-label" for="bridge_frame_0_site_url">Site URL</label>
        <input type="url" class="form-control bridge-frame-site-url" id="bridge_frame_0_site_url" maxlength="127" placeholder="https://example.com">
      </div>
      <div class="mb-3">
        <label class="form-label" for="bridge_frame_0_device_id">Device ID</label>
        <input type="text" class="form-control bridge-frame-device-id" id="bridge_frame_0_device_id" maxlength="63">
      </div>
      <div class="mb-3">
        <label class="form-label" for="bridge_frame_0_api_key">API key</label>
        <input type="password" class="form-control bridge-frame-api-key" id="bridge_frame_0_api_key" maxlength="64" autocomplete="new-password">
        <div class="form-text bridge-frame-key-status">Enter the frame API key.</div>
      </div>
    </div>
  </div>
</div>

<div class="card mb-3">
  <div class="card-header"><strong>Frame 2</strong></div>
  <div class="card-body" data-bridge-frame="1">
    <div class="mb-3 form-check">
      <input type="checkbox" class="form-check-input bridge-frame-enabled" id="bridge_frame_1_enabled">
      <label class="form-check-label" for="bridge_frame_1_enabled">Configure this frame</label>
    </div>
    <div class="bridge-frame-fields">
      <div class="mb-3">
        <label class="form-label" for="bridge_frame_1_site_url">Site URL</label>
        <input type="url" class="form-control bridge-frame-site-url" id="bridge_frame_1_site_url" maxlength="127" placeholder="https://example.com">
      </div>
      <div class="mb-3">
        <label class="form-label" for="bridge_frame_1_device_id">Device ID</label>
        <input type="text" class="form-control bridge-frame-device-id" id="bridge_frame_1_device_id" maxlength="63">
      </div>
      <div class="mb-3">
        <label class="form-label" for="bridge_frame_1_api_key">API key</label>
        <input type="password" class="form-control bridge-frame-api-key" id="bridge_frame_1_api_key" maxlength="64" autocomplete="new-password">
        <div class="form-text bridge-frame-key-status">Enter the frame API key.</div>
      </div>
    </div>
  </div>
</div>

<button type="button" class="btn btn-primary" id="epaper-ble-bridge-save">Save frame assignments</button>
